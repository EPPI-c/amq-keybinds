<!DOCTYPE html>
<html>
  <head>
    <title>Shortcut Config</title>
    <style>
      body { font-family: sans-serif; padding: 1rem; width: 200px; }
      label { display: block; margin-top: 0.5rem; }
    </style>
  </head>
  <body>
    <label><input type="checkbox" id="ctrl"> Ctrl</label>
    <label><input type="checkbox" id="alt"> Alt</label>
    <label><input type="checkbox" id="shift"> Shift</label>
    <label>Key: <input type="text" id="key" maxlength="1" /></label>
    <button id="save">Save</button>
  </body>
  <script src="popup.js"></script>
</html>
