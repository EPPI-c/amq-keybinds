<!DOCTYPE html>
<html>
  <head>
    <title>Shortcut Config</title>
    <style>
      body { font-family: sans-serif; padding: 1rem; width: 200px; }
      label { display: block; margin-top: 0.5rem; }
    </style>
  </head>
  <body>
      <div id="next">
          <label>next</label>
          <div id="next-shortcuts"></div>
          <button id="next-add-button">add</button>
      </div>
      <div id="previous">
          <label>previous</label>
          <div id="previous-shortcuts"></div>
          <button id="previous-add-button">add</button>
      </div>
      <div id="submit">
          <label>submit</label>
          <div id="submit-shortcuts"></div>
          <button id="submit-add-button">add</button>
      </div>
      <div id="escape">
          <label>escape</label>
          <div id="escape-shortcuts"></div>
          <button id="escape-add-button">add</button>
      </div>
      <div id="skip">
          <label>skip</label>
          <div id="skip-shortcuts"></div>
          <button id="skip-add-button">add</button>
      </div>
      <div id="focus">
          <label>switch-focus</label>
          <div id="focus-shortcuts"></div>
          <button id="focus-add-button">add</button>
      </div>
  </body>
  <script type="module" src="popup.js"></script>
</html>
